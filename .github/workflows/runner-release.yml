name: Runner Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: runner-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            shellcheck \
            xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95"
          components: clippy,rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install desktop UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Audit production UI dependencies
        run: pnpm --dir ui audit --prod

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Test release artifact contracts
        run: node --test scripts/*.test.mjs

      - name: Check Linux package test script
        run: shellcheck scripts/test-linux-package-install.sh

      - name: Check Linux Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features --locked --target x86_64-unknown-linux-gnu

      - name: Check Windows Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features --locked --target x86_64-pc-windows-msvc

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Test desktop UI contracts
        run: pnpm --dir ui test

      - name: Build desktop UI
        run: pnpm --dir ui build

  package:
    name: Package ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.os }}
    environment: runner-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows NSIS
            os: windows-latest
            bundles: nsis
          - label: Linux packages
            os: ubuntu-22.04
            bundles: appimage,deb,rpm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install desktop UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Build and upload signed desktop package
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: BaudBound ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  verify-release:
    name: Verify draft release
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Install native package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify draft metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            --json isDraft,isPrerelease \
            --jq 'if (.isDraft == true and .isPrerelease == false) then empty else error("release must be a non-prerelease draft") end'

      - name: Download draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/baudbound-release"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/baudbound-release"
          gh release view "$GITHUB_REF_NAME" \
            --json assets \
            > "$RUNNER_TEMP/baudbound-release-assets.json"

      - name: Generate release checksums
        run: >-
          node scripts/generate-release-checksums.mjs
          "$RUNNER_TEMP/baudbound-release"

      - name: Verify Linux native packages
        run: >-
          node scripts/verify-linux-packages-cli.mjs
          "$RUNNER_TEMP/baudbound-release"
          "$GITHUB_REF_NAME"

      - name: Test Debian package installation and removal
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/baudbound-release:/packages:ro" \
            debian:13-slim \
            bash /workspace/scripts/test-linux-package-install.sh \
            deb /packages "${GITHUB_REF_NAME#v}"

      - name: Test Ubuntu package installation and removal
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/baudbound-release:/packages:ro" \
            ubuntu:24.04 \
            bash /workspace/scripts/test-linux-package-install.sh \
            deb /packages "${GITHUB_REF_NAME#v}"

      - name: Test RPM package installation and removal
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/baudbound-release:/packages:ro" \
            fedora:43 \
            bash /workspace/scripts/test-linux-package-install.sh \
            rpm /packages "${GITHUB_REF_NAME#v}"

      - name: Verify updater manifest and artifacts
        run: >-
          node scripts/verify-release-assets.mjs
          "$RUNNER_TEMP/baudbound-release"
          "$GITHUB_REF_NAME"
          "BaudBound/baudbound"
          "$RUNNER_TEMP/baudbound-release-assets.json"

  publish-checksums:
    name: Publish verified checksums
    needs: verify-release
    runs-on: ubuntu-22.04
    environment: runner-release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Download verified draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/baudbound-release"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/baudbound-release"

      - name: Generate release checksums
        run: >-
          node scripts/generate-release-checksums.mjs
          "$RUNNER_TEMP/baudbound-release"

      - name: Upload release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/baudbound-release/SHA256SUMS"
          --clobber
