name: Runner CI

on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
  push:
    branches:
      - master
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "ui/**"
      - "scripts/**"
      - "linux/**"
      - "icons/**"
      - "capabilities/**"
      - "tests/**"
      - "build.rs"
      - "tauri*.json"
      - "crates/**"
      - "contracts"
      - ".gitmodules"
      - "deny.toml"
      - ".github/dependabot.yml"
      - ".github/workflows/runner-ci.yml"
      - ".github/workflows/runner-release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux-package-script:
    name: Linux package script
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Install shell verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Linux package test script
        run: shellcheck scripts/test-linux-package-install.sh

  dependency-security:
    name: Rust dependency policy (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features --locked --target ${{ matrix.target }}

  rust:
    name: Rust workspace (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04-arm
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install desktop UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build desktop UI
        run: pnpm --dir ui build

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Build runner application
        run: cargo build -p baudbound --locked

  desktop-ui:
    name: Desktop UI
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install desktop UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Audit production UI dependencies
        run: pnpm --dir ui audit --prod

      - name: Typecheck desktop UI
        run: pnpm --dir ui typecheck

      - name: Test desktop UI contracts
        run: pnpm --dir ui test

      - name: Build desktop UI
        run: pnpm --dir ui build

      - name: Test release artifact contracts
        run: node --test scripts/*.test.mjs
