[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
git-fetch-with-cli = true
maximum-db-staleness = "P1D"
unmaintained = "all"
unsound = "workspace"
unused-ignored-advisory = "deny"
yanked = "deny"

# Unmaintained advisories are scoped to the whole graph rather than to workspace
# members. Unmaintained crates are transitive by nature, so limiting the check to
# workspace members meant it could never fire.
#
# Every entry below is an unmaintained notice rather than a vulnerability, and
# every one reaches the graph through Tauri's Linux desktop stack. None can be
# removed by changing a direct BaudBound dependency. Re-check each on the review
# date, and drop the entry once the upstream chain moves.
#
# Owner: NATroutter
# Review by: 2026-11-04
ignore = [
    # proc-macro-error, a build-time proc macro reached through
    # glib-macros -> glib -> gtk -> tray-icon -> tauri.
    "RUSTSEC-2024-0370",
    # gtk-rs GTK3 bindings reached through tray-icon and wry. Tauri v2 still
    # targets GTK3 on Linux, so these leave when Tauri moves.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # unic-* Unicode crates reached through urlpattern -> tauri-utils.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "PolyForm-Noncommercial-1.0.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# Owner: NATroutter
# Reason: serialport uses unescaper to decode Linux udev metadata during serial device discovery.
# Review by: 2026-10-25. Replace this exception if serialport removes the dependency.
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "unescaper" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
