[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
git-fetch-with-cli = true
ignore = []
maximum-db-staleness = "P1D"
unmaintained = "workspace"
unsound = "workspace"
unused-ignored-advisory = "deny"
yanked = "deny"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "PolyForm-Noncommercial-1.0.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# Owner: NATroutter
# Reason: serialport uses unescaper to decode Linux udev metadata during serial device discovery.
# Review by: 2026-10-25. Replace this exception if serialport removes the dependency.
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "unescaper" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
